# The design section 7 oracles and the regeneration check, which R CMD check
# cannot run: the fixtures are fetched at pinned commits and are not in the
# tarball, and tools/ is not shipped. Also runs the suite in shuffled order,
# which the definition of done in CLAUDE.md requires.
on:
  push:
    branches: [main, master]
  pull_request:

name: oracles

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      # A missing fixture directory or source tree fails here, not skips.
      ZUMIME_REQUIRE_ORACLES: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::yaml, any::digest, any::jsonlite
          needs: check

      - name: The committed tables match their recorded sources
        run: Rscript tools/generate-tables.R --check

      - name: Fetch the oracle fixtures
        run: tools/fetch-fixtures

      - name: Run the suite with the oracles, in shuffled order
        shell: Rscript {0}
        run: |
          for (seed in c(1, 20261019)) {
            set.seed(seed)
            message("--- shuffled run, seed ", seed, " ---")
            devtools::test(shuffle = TRUE, stop_on_failure = TRUE)
          }
