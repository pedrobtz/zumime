on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit, with the tag in the comment: this is the one job
    # that holds a repository write token, and a tag is mutable. Bump
    # deliberately, reading the diff.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@17264ce002a9359a492e0183852a555a5bb866e7 # v1.23.0
    permissions:
      contents: write
    # The main ruleset requires pull requests, so a badge commit to main is
    # rejected ("Changes must be made through a pull request"). gh-pages
    # already takes the pkgdown deploy's bot pushes; pkgdown.yaml deploys
    # with `force: false` so it cannot overwrite a badge commit.
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
